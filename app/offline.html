<!doctype html>
<html lang="fr-CA">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#20231f">
  <title>Memi Studio — Hors connexion</title>
  <style>
    :root{color-scheme:light;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f2eb;color:#20231f}
    body{min-height:100vh;margin:0;display:grid;place-items:center;padding:28px;box-sizing:border-box}
    main{max-width:420px;text-align:center;background:#fff;border:1px solid #dedbd3;border-radius:28px;padding:42px 30px;box-shadow:0 24px 65px rgba(28,30,26,.12)}
    .mark{display:grid;place-items:center;width:74px;height:74px;margin:0 auto 22px;border-radius:24px;background:#20231f;color:#fff;font:600 38px Georgia,serif}
    h1{font:500 38px/1.05 Georgia,serif;margin:0 0 14px}p{line-height:1.55;color:#6d7068;margin:0 0 24px}button{border:0;border-radius:999px;background:#7f486c;color:#fff;padding:13px 22px;font-weight:700}
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">m</div>
    <h1>On se retrouve bientôt.</h1>
    <p>La connexion Internet est momentanément indisponible. Les informations récentes déjà chargées restent accessibles dans l’application.</p>
    <button type="button" onclick="location.reload()">Réessayer</button>
  </main>
</body>
</html>
